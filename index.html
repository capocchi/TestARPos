<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    <script>
        // AR.js 3.4.x calls THREE.MathUtils, which does not exist in the three.js
        // version bundled with A-Frame 1.0.4 (there it is THREE.Math). Without this
        // alias, gps-camera throws on every GPS update and never sets its origin,
        // leaving all gps-entity-place markers unanchored.
        if (window.AFRAME && AFRAME.THREE && !AFRAME.THREE.MathUtils) {
            AFRAME.THREE.MathUtils = AFRAME.THREE.Math || {};
        }
    </script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
    <div id="hud-stack">
        <div id="gps-hud" class="hud-panel">
            <div class="gps-hud-title">CURRENT GPS POSITION</div>
            <div class="gps-hud-row"><span class="gps-hud-label">Lat</span><span class="gps-hud-value" id="gps-lat">--</span></div>
            <div class="gps-hud-row"><span class="gps-hud-label">Lon</span><span class="gps-hud-value" id="gps-lon">--</span></div>
            <div class="gps-hud-row"><span class="gps-hud-label">Acc</span><span class="gps-hud-value" id="gps-acc">--</span></div>
            <div class="gps-hud-row"><span class="gps-hud-label">Alt</span><span class="gps-hud-value" id="gps-alt">--</span></div>
            <div class="gps-hud-status" id="gps-status">waiting for GPS…</div>
        </div>

        <div id="marker-hud" class="hud-panel">
            <div class="gps-hud-title">AR MARKER CHECK</div>
            <div class="gps-hud-row"><span class="gps-hud-label">Target</span><span class="gps-hud-value" id="marker-coords">42.297470, 9.154552</span></div>
            <div class="gps-hud-row"><span class="gps-hud-label">Spec</span><span class="gps-hud-value" id="marker-spec">±6 m · 496 m</span></div>
            <div class="gps-hud-row"><span class="gps-hud-label">JPEG</span><span class="gps-hud-value" id="marker-asset">loading…</span></div>
            <div class="gps-hud-row"><span class="gps-hud-label">To point</span><span class="gps-hud-value" id="marker-distance">--</span></div>
            <div class="gps-hud-status" id="marker-status">waiting for scene…</div>
        </div>
    </div>

    <style>
        #hud-stack {
            position: fixed;
            top: calc(12px + env(safe-area-inset-top, 0px));
            left: calc(12px + env(safe-area-inset-left, 0px));
            z-index: 9999;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: min(280px, calc(100vw - 24px));
        }

        .hud-panel {
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 13px;
            line-height: 1.45;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .gps-hud-title {
            font-size: 10px;
            letter-spacing: 0.08em;
            opacity: 0.75;
            margin-bottom: 4px;
        }

        .gps-hud-row {
            display: flex;
            justify-content: space-between;
            gap: 14px;
        }

        .gps-hud-label {
            opacity: 0.7;
        }

        .gps-hud-value {
            font-variant-numeric: tabular-nums;
        }

        .gps-hud-status {
            margin-top: 4px;
            font-size: 10px;
            opacity: 0.7;
        }

        .gps-hud-status.gps-error {
            color: #ff8989;
            opacity: 1;
        }

        .gps-hud-status.gps-ok {
            color: #8dffa8;
            opacity: 1;
        }

        .gps-hud-value.gps-error {
            color: #ff8989;
        }

        .gps-hud-value.gps-ok {
            color: #8dffa8;
        }
    </style>

    <a-scene embedded loading-screen="enabled: false;" arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-assets>
            <img id="marker-texture" src="assets/asset.jpeg">
        </a-assets>

        <!-- Central JPEG plus a generated ring of copies around the point, so the
             marker is visible across a region instead of at one exact spot.
             AR.js gps-entity-place supports latitude/longitude only, so altitude
             is reported as metadata. -->
        <a-image id="ar-marker" src="#marker-texture" look-at="[gps-camera]" scale="6 6 1"
            material="side: double"
            gps-entity-place="latitude: 42.297470; longitude: 9.154552;"
            data-target-accuracy="6" data-target-altitude="496"></a-image>

        <a-camera gps-camera="
                    gpsMinDistance: 1;
                    positionMinAccuracy: 100;
                    gpsTimeInterval: 1000;
                " rotation-reader></a-camera>
    </a-scene>

    <script>
        (function () {
            var TARGET = {
                latitude: 42.297470,
                longitude: 9.154552,
                accuracy: 6,
                altitude: 496
            };

            // Visibility region: copies of the JPEG arranged in a ring around the
            // target, so the marker can be seen before reaching the exact point.
            var RING_COUNT = 8;
            var RING_RADIUS_M = 12;
            var RING_MARKER_SCALE = 4;
            var CENTER_MARKER_SCALE = 6;

            var latEl = document.getElementById('gps-lat');
            var lonEl = document.getElementById('gps-lon');
            var accEl = document.getElementById('gps-acc');
            var altEl = document.getElementById('gps-alt');
            var statusEl = document.getElementById('gps-status');

            var markerEl = document.getElementById('ar-marker');
            var coordsEl = document.getElementById('marker-coords');
            var specEl = document.getElementById('marker-spec');
            var assetEl = document.getElementById('marker-asset');
            var distanceEl = document.getElementById('marker-distance');
            var markerStatusEl = document.getElementById('marker-status');

            var markerEls = [markerEl];
            var anchoredMarkers = {};

            var textureLoaded = false;
            var anchored = false;

            function haversine(aLat, aLon, bLat, bLon) {
                var R = 6371000;
                var toRad = Math.PI / 180;
                var dLat = (bLat - aLat) * toRad;
                var dLon = (bLon - aLon) * toRad;
                var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(aLat * toRad) * Math.cos(bLat * toRad) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
                return 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h)) * R;
            }

            function formatDistance(meters) {
                if (!Number.isFinite(meters)) return '--';
                return meters >= 1000
                    ? (meters / 1000).toFixed(2) + ' km'
                    : meters.toFixed(1) + ' m';
            }

            function formatCoord(value, positive, negative) {
                return value.toFixed(6) + '° ' + (value >= 0 ? positive : negative);
            }

            function setStatus(text, isError) {
                statusEl.textContent = text;
                statusEl.classList.toggle('gps-error', !!isError);
            }

            function setMarkerStatus(text, cls) {
                markerStatusEl.textContent = text;
                markerStatusEl.classList.remove('gps-error', 'gps-ok');
                if (cls) markerStatusEl.classList.add(cls);
            }

            function setAssetState(text, cls) {
                assetEl.textContent = text;
                assetEl.classList.remove('gps-error', 'gps-ok');
                if (cls) assetEl.classList.add(cls);
            }

            function textureInfo() {
                // Prefer the preloaded <a-assets> image: it is the source of truth
                // that the JPEG actually downloaded.
                var img = document.getElementById('marker-texture');
                var image = img && img.complete && (img.naturalWidth || img.width) ? img : null;

                if (!image) {
                    var mesh = markerEl.getObject3D('mesh');
                    var map = mesh && mesh.material && mesh.material.map;
                    image = map && (map.image || (map.source && map.source.data));
                }
                if (!image) return null;

                var width = image.naturalWidth || image.videoWidth || image.width || 0;
                var height = image.naturalHeight || image.videoHeight || image.height || 0;
                if (!width || !height) return null;
                return { width: width, height: height };
            }

            function markTextureLoaded() {
                if (textureLoaded) return;
                var info = textureInfo();
                textureLoaded = true;
                setAssetState(
                    info && info.width
                        ? 'loaded ✓ (' + info.width + '×' + info.height + ')'
                        : 'loaded ✓',
                    'gps-ok'
                );
                verifyPlacement();
            }

            function offsetCoords(latitude, longitude, distanceMeters, bearingRad) {
                var R = 6378137;
                var dLat = (distanceMeters * Math.cos(bearingRad)) / R;
                var dLon = (distanceMeters * Math.sin(bearingRad)) /
                    (R * Math.cos(latitude * Math.PI / 180));
                return {
                    latitude: latitude + (dLat * 180) / Math.PI,
                    longitude: longitude + (dLon * 180) / Math.PI
                };
            }

            function createMarkerEl(latitude, longitude, scale, role) {
                var el = document.createElement('a-image');
                el.setAttribute('src', '#marker-texture');
                el.setAttribute('look-at', '[gps-camera]');
                el.setAttribute('scale', scale + ' ' + scale + ' 1');
                el.setAttribute('material', 'side: double');
                el.setAttribute('gps-entity-place',
                    'latitude: ' + latitude + '; longitude: ' + longitude + ';');
                el.setAttribute('data-role', role);
                return el;
            }

            function buildMarkerRing() {
                var sceneEl = document.querySelector('a-scene');
                if (!sceneEl) return;
                for (var i = 0; i < RING_COUNT; i++) {
                    var bearing = (i / RING_COUNT) * Math.PI * 2;
                    var pos = offsetCoords(
                        TARGET.latitude,
                        TARGET.longitude,
                        RING_RADIUS_M,
                        bearing
                    );
                    var el = createMarkerEl(pos.latitude, pos.longitude, RING_MARKER_SCALE, 'ring');
                    el.id = 'ar-marker-ring-' + i;
                    el.addEventListener('gps-entity-place-update-position', onMarkerAnchored);
                    sceneEl.appendChild(el);
                    markerEls.push(el);
                }
            }

            function onMarkerAnchored(event) {
                var el = event.target;
                if (el && el.id) anchoredMarkers[el.id] = true;
                anchored = true;
                verifyPlacement();
            }

            function cameraHasOrigin() {
                var camEl = document.querySelector('[gps-camera]');
                var comp = camEl && camEl.components && camEl.components['gps-camera'];
                return !!(comp && comp.originCoords);
            }

            function countAnchoredMarkers() {
                var count = 0;
                for (var i = 0; i < markerEls.length; i++) {
                    var el = markerEls[i];
                    if (anchoredMarkers[el.id]) {
                        count += 1;
                        continue;
                    }
                    // Fallback: the entity is anchored once the camera has an origin.
                    var comp = el.components && el.components['gps-entity-place'];
                    if (comp && comp._cameraGps && comp._cameraGps.originCoords) {
                        anchoredMarkers[el.id] = true;
                        count += 1;
                    }
                }
                return count;
            }

            function verifyPlacement() {
                var comp = markerEl.components && markerEl.components['gps-entity-place'];
                var info = textureInfo();

                if (info) markTextureLoaded();

                if (!comp || !comp.data) {
                    setMarkerStatus('initializing marker…');
                    return;
                }

                // Read the values actually applied by AR.js, not just the HTML.
                var lat = Number(comp.data.latitude);
                var lon = Number(comp.data.longitude);
                var coordsMatch =
                    Math.abs(lat - TARGET.latitude) < 1e-7 &&
                    Math.abs(lon - TARGET.longitude) < 1e-7;

                coordsEl.textContent = lat.toFixed(6) + ', ' + lon.toFixed(6);
                specEl.textContent = '±' + TARGET.accuracy + ' m · alt ' + TARGET.altitude +
                    ' m · ring ' + RING_RADIUS_M + ' m';

                if (!coordsMatch) {
                    setMarkerStatus('coordinate mismatch', 'gps-error');
                    return;
                }
                if (!textureLoaded) {
                    setMarkerStatus('loading JPEG…');
                    return;
                }

                // AR.js only anchors entities once the camera has a GPS origin.
                if (!anchored && cameraHasOrigin()) {
                    anchored = true;
                }
                if (!anchored) {
                    setMarkerStatus('JPEG loaded, waiting for GPS fix…');
                    return;
                }

                var anchoredCount = countAnchoredMarkers();
                setMarkerStatus(
                    'loaded & anchored ✓ (' + anchoredCount + '/' + markerEls.length + ' markers)',
                    'gps-ok'
                );
            }

            // AR.js dispatches this once the marker has a world position.
            markerEl.addEventListener('gps-entity-place-update-position', onMarkerAnchored);

            markerEl.setAttribute('scale', CENTER_MARKER_SCALE + ' ' + CENTER_MARKER_SCALE + ' 1');

            // Add the ring only after A-Frame initialized the scene, so the new
            // entities get a GPS camera to anchor against immediately.
            var sceneEl = document.querySelector('a-scene');
            if (sceneEl.hasLoaded) {
                buildMarkerRing();
            } else {
                sceneEl.addEventListener('loaded', buildMarkerRing);
            }

            if (markerEl.hasLoaded) {
                verifyPlacement();
            } else {
                markerEl.addEventListener('loaded', verifyPlacement);
            }
            markerEl.addEventListener('materialtextureloaded', markTextureLoaded);

            var textureImg = document.getElementById('marker-texture');
            if (textureImg) {
                if (textureImg.complete && (textureImg.naturalWidth || textureImg.width)) {
                    markTextureLoaded();
                } else {
                    textureImg.addEventListener('load', markTextureLoaded);
                    textureImg.addEventListener('error', function () {
                        setAssetState('failed ✗', 'gps-error');
                        setMarkerStatus('JPEG could not be loaded', 'gps-error');
                    });
                }
            }

            // Fallback polling: covers cached textures that load before listeners attach.
            var polls = 0;
            var pollTimer = setInterval(function () {
                polls += 1;
                if (!textureLoaded) {
                    if (textureInfo()) {
                        markTextureLoaded();
                    } else if (polls >= 40) {
                        setAssetState('not loaded ✗', 'gps-error');
                        setMarkerStatus('JPEG failed to load after 20 s', 'gps-error');
                    }
                }
                verifyPlacement();
                if (textureLoaded && anchored) clearInterval(pollTimer);
            }, 500);

            if (!navigator.geolocation) {
                setStatus('geolocation not supported', true);
                return;
            }

            function onPosition(position) {
                var coords = position.coords;

                latEl.textContent = formatCoord(coords.latitude, 'N', 'S');
                lonEl.textContent = formatCoord(coords.longitude, 'E', 'W');
                accEl.textContent = Number.isFinite(coords.accuracy)
                    ? '±' + Math.round(coords.accuracy) + ' m'
                    : '--';
                altEl.textContent = Number.isFinite(coords.altitude)
                    ? Math.round(coords.altitude) + ' m'
                    : '--';

                var distance = haversine(
                    coords.latitude,
                    coords.longitude,
                    TARGET.latitude,
                    TARGET.longitude
                );
                distanceEl.textContent = formatDistance(distance);

                var time = new Date(position.timestamp).toLocaleTimeString();
                setStatus('updated ' + time);
            }

            function onError(error) {
                var messages = {
                    1: 'permission denied',
                    2: 'position unavailable',
                    3: 'timed out'
                };
                setStatus('GPS error: ' + (messages[error.code] || error.message), true);
            }

            statusEl.textContent = 'locating…';

            navigator.geolocation.watchPosition(onPosition, onError, {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 15000
            });
        })();
    </script>
</body>

</html>
