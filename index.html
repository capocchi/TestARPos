<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="stylesheet" href="assets/style.css" />
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    <script src="assets/arjs-compat.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
    <div id="hud-stack">
        <div id="gps-hud" class="hud-panel">
            <div class="gps-hud-title">CURRENT GPS POSITION</div>
            <div class="gps-hud-row"><span class="gps-hud-label">Lat</span><span class="gps-hud-value" id="gps-lat">--</span></div>
            <div class="gps-hud-row"><span class="gps-hud-label">Lon</span><span class="gps-hud-value" id="gps-lon">--</span></div>
            <div class="gps-hud-row"><span class="gps-hud-label">Acc</span><span class="gps-hud-value" id="gps-acc">--</span></div>
            <div class="gps-hud-row"><span class="gps-hud-label">Alt</span><span class="gps-hud-value" id="gps-alt">--</span></div>
            <div class="gps-hud-status" id="gps-status">waiting for GPS…</div>
        </div>

        <div id="marker-hud" class="hud-panel">
            <div class="gps-hud-title">AR MARKER CHECK</div>
            <div class="gps-hud-row"><span class="gps-hud-label">Target</span><span class="gps-hud-value" id="marker-coords">42.297470, 9.154552</span></div>
            <div class="gps-hud-row"><span class="gps-hud-label">Spec</span><span class="gps-hud-value" id="marker-spec">±6 m · 496 m</span></div>
            <div class="gps-hud-row"><span class="gps-hud-label">JPEG</span><span class="gps-hud-value" id="marker-asset">loading…</span></div>
            <div class="gps-hud-row"><span class="gps-hud-label">To point</span><span class="gps-hud-value" id="marker-distance">--</span></div>
            <div class="gps-hud-status" id="marker-status">waiting for scene…</div>
        </div>
    </div>

    <a-scene embedded loading-screen="enabled: false;" arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-assets>
            <img id="marker-texture" src="assets/asset.jpeg">
        </a-assets>

        <!-- Single JPEG anchored at the measured position. It does not follow the
             camera: it stays at this coordinate and only becomes visible when you
             get within SHOW_RADIUS_M. Altitude is metadata only because AR.js
             gps-entity-place supports latitude/longitude only. -->
        <a-image id="ar-marker" src="#marker-texture" look-at="[gps-camera]" scale="5 5 1"
            material="side: double" visible="false"
            gps-entity-place="latitude: 42.297470; longitude: 9.154552;"
            data-target-accuracy="6" data-target-altitude="496"></a-image>

        <a-camera gps-camera="
                    gpsMinDistance: 1;
                    positionMinAccuracy: 100;
                    gpsTimeInterval: 1000;
                    maxDistance: 30;
                " rotation-reader></a-camera>
    </a-scene>

    <script src="assets/app.js"></script>
</body>

</html>
